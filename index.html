<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>月間予算マネージャー</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #18202c;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #1a73e8;
      --danger: #dc2626;
      --warn: #d97706;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 16px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 720px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.25rem; margin: 0; }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, input, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      background: #fff;
      color: var(--text);
    }
    button {
      cursor: pointer;
      font-weight: 600;
      border: none;
      background: var(--primary);
      color: #fff;
    }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .hero {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      margin-bottom: 14px;
    }
    .hero-label { font-size: 0.85rem; color: var(--muted); }
    .hero-amount { font-size: 2rem; font-weight: 800; margin: 4px 0 8px; }
    .hero-sub { font-size: 0.88rem; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .bar-wrap {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .cat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .cat-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .cat-name { font-weight: 700; font-size: 1rem; }
    .cat-rem { font-weight: 700; font-size: 0.95rem; }
    .cat-meta { font-size: 0.82rem; color: var(--muted); display: flex; justify-content: space-between; }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      margin-bottom: 16px;
    }
    .panel h2 { font-size: 1rem; margin: 0 0 12px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      gap: 8px;
    }
    .log-left { display: flex; flex-direction: column; gap: 2px; }
    .log-date { font-size: 0.78rem; color: var(--muted); }
    .log-amount { font-weight: 700; white-space: nowrap; }
    .status-msg { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>月間予算マネージャー</h1>
      <div class="controls-row">
        <select id="monthSelect" aria-label="対象月"></select>
        <button id="refreshBtn" class="secondary" type="button">更新</button>
      </div>
    </div>

    <div class="hero">
      <div class="hero-label">選択月の残り予算（合計予算 ¥91,000）</div>
      <div id="totalRemaining" class="hero-amount">¥91,000</div>
      <div class="hero-sub">
        <span id="totalSpentText">利用額: ¥0</span>
        <span id="currentMonthBadge">対象月: -</span>
      </div>
      <div class="bar-wrap">
        <div id="totalBar" class="bar-fill" style="width: 0%; background: var(--ok);"></div>
      </div>
    </div>

    <div id="categoryGrid" class="grid"></div>

    <div class="panel">
      <h2>支出を記録する</h2>
      <form id="addForm" class="form-grid">
        <select id="catInput" required>
          <option value="交際費">交際費（¥30,000）</option>
          <option value="娯楽費">娯楽費（¥20,000）</option>
          <option value="雑費">雑費（¥16,000）</option>
          <option value="食費">食費（¥15,000）</option>
          <option value="交通費">交通費（¥10,000）</option>
        </select>
        <input id="storeInput" type="text" placeholder="店舗・用途（例：スーパー）" required />
        <input id="amountInput" type="number" min="1" step="1" placeholder="金額（円）" required />
        <button id="submitBtn" type="submit">記録する</button>
      </form>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="panel">
      <h2>選択月の利用履歴</h2>
      <div id="historyList" class="log-list">
        <div class="status-msg">データを読み込み中...</div>
      </div>
    </div>
  </div>

  <script>
    // ▼ GASのウェブアプリURL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxEIh91VHtyuDuOF8IVbW909f0DyrffEmquWa9CW3hFOAIUEAtR1ejypslL4uhUgRc6/exec';

    const BUDGETS = {
      '交際費': 30000,
      '娯楽費': 20000,
      '雑費': 16000,
      '食費': 15000,
      '交通費': 10000
    };
    const TOTAL_BUDGET = Object.values(BUDGETS).reduce((a, b) => a + b, 0);

    let allRecords = [];
    let selectedMonth = getCurrentYearMonth();

    function getCurrentYearMonth() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      return `${y}-${m}`;
    }

    function normalizeYearMonth(val) {
      if (!val) return '';
      const str = String(val).trim();
      if (/^\d{4}-\d{2}$/.test(str)) return str;

      const ymdMatch = str.match(/^(\d{4})[-/](\d{1,2})/);
      if (ymdMatch) {
        return `${ymdMatch[1]}-${String(ymdMatch[2]).padStart(2, '0')}`;
      }

      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      }
      return str;
    }

    function formatYen(num) {
      return '¥' + Number(num || 0).toLocaleString('ja-JP');
    }

    function setStatus(msg) {
      document.getElementById('statusMsg').textContent = msg;
    }

    async function loadRecords() {
      if (!GAS_URL || GAS_URL.includes('ここにGASの')) {
        setStatus('GAS_URLが未設定です。HTML内のGAS_URLを書き換えてください。');
        render();
        return;
      }
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      setStatus('スプレッドシートから履歴を取得中...');
      try {
        const res = await fetch(`${GAS_URL}?t=${Date.now()}`);
        const json = await res.json();
        allRecords = Array.isArray(json.records)
          ? json.records.map(r => ({
              ...r,
              yearMonth: normalizeYearMonth(r.yearMonth)
            }))
          : [];
        const currentYM = getCurrentYearMonth();
        if (!allRecords.some(r => r.yearMonth === selectedMonth) && selectedMonth !== currentYM) {
          selectedMonth = currentYM;
        }
        setStatus('最新データを反映しました。');
      } catch (err) {
        setStatus('読み込みに失敗しました。GASの公開設定（全員）やURLを確認してください。');
      } finally {
        btn.disabled = false;
        render();
      }
    }

    function populateMonthSelect() {
      const select = document.getElementById('monthSelect');
      const currentYM = getCurrentYearMonth();
      const monthsSet = new Set([currentYM, ...allRecords.map(r => normalizeYearMonth(r.yearMonth)).filter(Boolean)]);
      const months = Array.from(monthsSet).sort().reverse();
      if (!months.includes(selectedMonth)) {
        selectedMonth = currentYM;
      }
      select.innerHTML = months.map(m =>
        `<option value="${m}" ${m === selectedMonth ? 'selected' : ''}>${m}${m === currentYM ? '（今月）' : ''}</option>`
      ).join('');
    }

    function render() {
      populateMonthSelect();
      const monthRecords = allRecords.filter(r => normalizeYearMonth(r.yearMonth) === selectedMonth);
      const spentByCat = {};
      Object.keys(BUDGETS).forEach(k => { spentByCat[k] = 0; });

      let totalSpent = 0;
      monthRecords.forEach(r => {
        const amt = Number(r.amount) || 0;
        totalSpent += amt;
        const cat = String(r.category || '').trim();
        if (spentByCat[cat] !== undefined) {
          spentByCat[cat] += amt;
        } else {
          spentByCat['雑費'] = (spentByCat['雑費'] || 0) + amt;
        }
      });

      const totalRemaining = TOTAL_BUDGET - totalSpent;
      const totalRatio = Math.min(100, Math.round((totalSpent / TOTAL_BUDGET) * 100));

      document.getElementById('totalRemaining').textContent = formatYen(totalRemaining);
      document.getElementById('totalRemaining').style.color = totalRemaining < 0 ? 'var(--danger)' : 'var(--text)';
      document.getElementById('totalSpentText').textContent = `利用額: ${formatYen(totalSpent)} / ${formatYen(TOTAL_BUDGET)}`;
      document.getElementById('currentMonthBadge').textContent = `対象月: ${selectedMonth}`;

      const totalBar = document.getElementById('totalBar');
      totalBar.style.width = `${totalRatio}%`;
      totalBar.style.background = totalRemaining < 0 ? 'var(--danger)' : (totalRatio >= 80 ? 'var(--warn)' : 'var(--ok)');

      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = Object.entries(BUDGETS).map(([cat, budget]) => {
        const spent = spentByCat[cat] || 0;
        const rem = budget - spent;
        const pct = Math.min(100, Math.round((spent / budget) * 100));
        const barColor = rem < 0 ? 'var(--danger)' : (pct >= 80 ? 'var(--warn)' : 'var(--primary)');
        return `
          <div class="cat-card">
            <div class="cat-header">
              <span class="cat-name">${cat}</span>
              <span class="cat-rem" style="color:${rem < 0 ? 'var(--danger)' : 'var(--text)'}">残 ${formatYen(rem)}</span>
            </div>
            <div class="cat-meta">
              <span>利用: ${formatYen(spent)}</span>
              <span>予算: ${formatYen(budget)}</span>
            </div>
            <div class="bar-wrap">
              <div class="bar-fill" style="width:${pct}%; background:${barColor};"></div>
            </div>
          </div>
        `;
      }).join('');

      const list = document.getElementById('historyList');
      if (monthRecords.length === 0) {
        list.innerHTML = '<div class="status-msg">この月の支出記録はまだありません。</div>';
      } else {
        list.innerHTML = [...monthRecords].reverse().map(r => `
          <div class="log-item">
            <div class="log-left">
              <strong>${r.store || '（店舗未入力）'} ・ ${r.category}</strong>
              <span class="log-date">${r.date}</span>
            </div>
            <span class="log-amount">-${formatYen(r.amount)}</span>
          </div>
        `).join('');
      }
    }

    document.getElementById('monthSelect').addEventListener('change', (e) => {
      selectedMonth = e.target.value;
      render();
    });

    document.getElementById('refreshBtn').addEventListener('click', loadRecords);

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!GAS_URL || GAS_URL.includes('ここにGASの')) {
        setStatus('先にGAS_URLを設定してください。');
        return;
      }
      const btn = document.getElementById('submitBtn');
      const category = document.getElementById('catInput').value;
      const store = document.getElementById('storeInput').value.trim();
      const amount = Number(document.getElementById('amountInput').value);

      btn.disabled = true;
      setStatus('送信中...');
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category, store, amount })
        });
        document.getElementById('storeInput').value = '';
        document.getElementById('amountInput').value = '';
        selectedMonth = getCurrentYearMonth();
        setTimeout(loadRecords, 800);
      } catch (err) {
        setStatus('送信エラーが発生しました。');
      } finally {
        btn.disabled = false;
      }
    });

    loadRecords();
  </script>
</body>
</html>
